[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vein"
version = "0.1.0"
description = "See what your code actually does when it runs: runtime call graphs, dead code, and execution diffs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nikhil" }]
keywords = ["profiler", "call-graph", "dead-code", "tracing", "diff", "refactoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nikhilcherry/vein"
Issues = "https://github.com/nikhilcherry/vein/issues"

[project.scripts]
vein = "vein.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vein"]

[tool.pytest.ini_options]
testpaths = ["tests"]
